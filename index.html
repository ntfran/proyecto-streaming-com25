<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de streaming interactiva con el mejor catálogo de películas y series. Proyecto integrador RollingCode."
    />
    <meta name="author" content="Grupo 3 - Comision Web 25" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>nombre-de-ejemplo</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg sticky-top navbar-estilo">
        <div class="container">
          <a class="navbar-brand marca-logo" href="#">
            <span class="letra-o">ó</span><span class="resto-texto">rbita</span>
          </a>

          <button
            class="navbar-toggler border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#contenidoNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="contenidoNav">
            <div class="d-flex justify-content-center flex-fill my-3 my-lg-0">
              <form class="formulario-busqueda" role="search">
                <div class="input-group">
                  <input
                    class="form-control entrada-busqueda"
                    type="search"
                    placeholder="Buscar..."
                    aria-label="Search"
                  />
                  <span class="input-group-text icono-busqueda">
                    <i class="bi bi-search"></i>
                  </span>
                </div>
              </form>
            </div>

            <div
              class="d-flex flex-column flex-md-row justify-content-md-center justify-content-lg-end align-items-stretch align-items-lg-center gap-3 gap-md-5 gap-lg-3 pb-3 pb-lg-0"
            >
              <button
                type="button"
                class="btn btn-link boton-ingresar text-decoration-none"
                data-bs-toggle="modal"
                data-bs-target="#modalLogin"
              >
                Iniciar Sesión
              </button>
              <a
                href="./pages/suscripcion.html"
                class="btn fw-bold boton-suscribirse"
              >
                Suscribirse
              </a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main></main>
    <footer></footer>
    <!-- Modal de iniciar sesion -->
    <div class="modal fade" id="modalLogin" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content contenedor-modal border border-secondary rounded-4 p-3"
        >
          <div class="modal-header border-0 pb-0">
            <div class="d-flex flex-row">
            <h5 class="modal-title marca-logo">
              Ingresar a <span class="letra-o ms-2">ó</span
              ><span class="resto-texto">rbita</span>
            </h5>
             </div>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body pt-3">
            <form action="./pages/error404.html">
              <div class="mb-3">
                <label for="emailLogin" class="form-label mb-1"
                  >Correo electrónico</label
                >
                <input
                  type="email"
                  class="form-control entrada-busqueda"
                  id="emailLogin"
                  placeholder="nombre@ejemplo.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="passwordLogin" class="form-label mb-1"
                  >Contraseña</label
                >
                <input
                  type="password"
                  class="form-control entrada-busqueda"
                  id="passwordLogin"
                  placeholder="••••••••"
                  required
                />
              </div>

              <div class="text-end mb-4">
                <a
                  href="./pages/error404.html"
                  class="link-recuperar text-decoration-none"
                >
                  ¿Olvidaste tu contraseña?
                </a>
              </div>

              <button
                type="submit"
                class="btn fw-bold boton-modal-enviar w-100 py-2"
              >
                Iniciar sesión
              </button>
            </form>

            <div class="d-flex align-items-center my-4">
              <hr class="flex-grow-1 border-secondary m-0" />
              <span class="px-3 texto-o-divisor">o</span>
              <hr class="flex-grow-1 border-secondary m-0" />
            </div>

            <a
              href="./pages/error404.html"
              class="btn boton-modal-google w-100 py-2 text-decoration-none"
            >
              <i class="bi bi-google me-2"></i>Continuar con Google
            </a>
            <div class="d-flex justify-content-center align-content-center mb-2 mt-3 gap-2">
              <p class="m-0">¿No tienes cuenta?</p>
              <a
                href="./pages/error404.html"
                class="link-recuperar text-decoration-none m-0"
              >
                Registrarse
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
