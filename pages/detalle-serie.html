<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de streaming interactiva con el mejor catálogo de películas y series. Proyecto integrador RollingCode."
    />
    <meta name="author" content="Grupo 3 - Comision Web 25" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>nombre-de-ejemplo</title>
  </head>
  <body>
    <head></head>
    <main class="bg-dark text-light min-vh-100 py-5">

  <section class="container">

    <div class="row align-items-center g-5">

      <div class="col-12 col-md-5">
        <img 
          src="img/serie.jpg" 
          alt="Portada de la serie" 
          class="img-fluid rounded-4 shadow"
        >
      </div>

      <div class="col-12 col-md-7">
        <span class="badge bg-success mb-3">Serie destacada</span>

        <h1 class="display-5 fw-bold mb-3">Nombre de la serie</h1>

        <p class="text-secondary mb-3">
          2024 • 3 temporadas • Ciencia ficción • +16
        </p>

        <p class="lead mb-4">
          En un futuro cercano, un grupo de personas descubre una amenaza oculta
          que podría cambiar el destino de la humanidad.
        </p>

        <div class="d-flex gap-3 mb-4">
          <button class="btn btn-success fw-bold px-4">
            Ver ahora
          </button>

          <button class="btn btn-outline-light px-4">
            Mi lista
          </button>
        </div>

        <div class="row g-3">
          <div class="col-6 col-md-4">
            <div class="bg-black border border-secondary rounded-4 p-3">
              <h6 class="text-success mb-1">Calificación</h6>
              <p class="mb-0">8.7/10</p>
            </div>
          </div>

          <div class="col-6 col-md-4">
            <div class="bg-black border border-secondary rounded-4 p-3">
              <h6 class="text-success mb-1">Episodios</h6>
              <p class="mb-0">24</p>
            </div>
          </div>

          <div class="col-6 col-md-4">
            <div class="bg-black border border-secondary rounded-4 p-3">
              <h6 class="text-success mb-1">Duración</h6>
              <p class="mb-0">45 min</p>
            </div>
          </div>
        </div>
      </div>

    </div>

  </section>

</main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
