<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de streaming interactiva con el mejor catálogo de películas y series. Proyecto integrador RollingCode."
    />
    <meta name="author" content="Grupo 3 - Comision Web 25" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Órbita - Insidious</title>
  </head>
  <body>
    <header>
      <!-- ESPACIO RESERVADO PARA EL NAVBAR (Se encarga otro integrante del equipo) -->
    </header>

    <main>
      <!-- PASO 1: Hero Cinemático -->
      <section class="hero-detalle position-relative overflow-hidden py-5 mb-5">
        <div class="hero-backdrop-img"></div>
        <div class="hero-overlay"></div>
        
        <div class="container position-relative z-3 my-md-4">
          <div class="row align-items-center gy-4">
            <!-- Columna Póster -->
            <div class="col-12 col-md-4 col-lg-3 text-center text-md-start">
              <img
                src="../img/portadas/terror-insidious.jpg"
                alt="Póster de Insidious"
                class="img-fluid rounded-4 shadow-lg poster-pelicula border border-secondary"
              />
            </div>
            
            <!-- Columna Información -->
            <div class="col-12 col-md-8 col-lg-9 text-center text-md-start text-white">
              <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-2 mb-3">
                <span class="badge bg-danger text-white fw-bold">TERROR</span>
                <span class="badge bg-secondary">1H 43M</span>
                <span class="badge bg-secondary">16+</span>
                <span class="badge bg-secondary">2010</span>
              </div>
              
              <h1 class="titulo-pelicula mb-3 font-titulo">Insidious</h1>
              
              <p class="descripcion-corta mb-4 text-white-50">
                Una familia descubre que el cuerpo de su hijo en coma se ha convertido en un canal para entes malignos, mientras su conciencia está atrapada en un reino oscuro conocido como El Más Allá.
              </p>
              
              <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-3">
                <a href="./error404.html" class="btn btn-light fw-bold px-4 py-2 rounded-pill">
                  <i class="bi bi-play-fill fs-5"></i> Reproducir Ahora
                </a>
                <a href="./error404.html" class="btn btn-outline-light fw-bold px-4 py-2 rounded-pill">
                  <i class="bi bi-plus-lg"></i> Añadir a Mi Lista
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <!-- ESPACIO RESERVADO PARA EL FOOTER (Se encarga otro integrante del equipo) -->
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
