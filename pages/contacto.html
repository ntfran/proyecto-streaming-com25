<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de streaming interactiva con el mejor catálogo de películas y series. Proyecto integrador RollingCode."
    />
    <meta name="author" content="Grupo 3 - Comision Web 25" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>nombre-de-ejemplo</title>
  </head>
  <body>
    <head></head>
    <main class="bg-dark text-light py-5 min-vh-100">
  <section class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card bg-black text-light border border-secondary shadow-lg rounded-4">
          <div class="card-body p-4 p-md-5">

            <h1 class="fw-bold mb-3 text-success">Contacto</h1>
            <p class="text-secondary mb-4">
              ¿Tenés alguna consulta? Completá el formulario y te responderemos a la brevedad.
            </p>

            <form>
              <div class="mb-3">
                <label class="form-label fw-semibold">Nombre</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Ingresá tu nombre">
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control bg-dark text-light border-secondary" placeholder="Ingresá tu email">
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Asunto</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Motivo de la consulta">
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">Mensaje</label>
                <textarea class="form-control bg-dark text-light border-secondary" rows="5" placeholder="Escribí tu mensaje"></textarea>
              </div>

              <button type="submit" class="btn w-100 fw-bold text-dark btn-orbita">
                Enviar consulta
              </button>
            </form>

          </div>
        </div>

      </div>
    </div>
  </section>
</main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
